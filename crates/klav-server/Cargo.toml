[package]
name = "klav-server"
description = "Klav sync server (zero-knowledge storage of encrypted vaults)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "AGPL-3.0-only"
repository.workspace = true
publish.workspace = true

[dependencies]
klav-core.workspace = true
klav-proto.workspace = true
# ES256 for APNs provider tokens (ADR 0018 §5): the provider rustls
# already uses, never for vault cryptography.
aws-lc-rs = { version = "1.19", default-features = false, features = ["alloc", "aws-lc-sys"] }
axum = "0.8"
data-encoding = "2.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["any", "sqlite-bundled", "postgres", "runtime-tokio", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "fs", "io-util"] }
tokio-stream = { version = "0.1", features = ["sync"] }
toml = "1"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["limit", "set-header", "trace", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
secrecy = "0.10"
zeroize = "1.9"

# HTTP/2 + TLS client for APNs (rustls with aws-lc-rs, as the clients, ADR 0011).
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "http2"] }

[dev-dependencies]
bytes = "1"
futures-util = { version = "0.3", default-features = false }
klav-core = { workspace = true, features = ["insecure-test-kdf"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream"] }
tempfile = "3"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }

[lints]
workspace = true

[package]
name = "klav-sdk"
description = "Klav SDK for agent runtimes: agent identity, signed requests, grants, and actions that never hand values to the LLM"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository.workspace = true
publish.workspace = true

[dependencies]
data-encoding = "2.11"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
klav-client.workspace = true
klav-core.workspace = true
klav-daemon.workspace = true
klav-proto.workspace = true
klav-touchid.workspace = true
# Only to compare errnos in the secret-file writer (`secret_file`): same
# version as the rest of the workspace, no features.
nix = { version = "0.31", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "net", "process", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect"] }
url = "2"
zeroize = "1.9"

[dev-dependencies]
# The end-to-end tests edit the server's SQLite file while it is stopped, to
# play a malicious server (same features as klav-client's tests, so the
# workspace builds it once).
sqlx = { version = "0.9", default-features = false, features = ["any", "sqlite-bundled", "postgres", "runtime-tokio", "migrate", "macros"] }
proptest = "1.12"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true

[package]
name = "klav-cli"
description = "Klav command-line interface (binary `klav`, includes `klav mcp`)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository.workspace = true
publish.workspace = true
# The build's identity for `--version`, the same script as klavd's.
build = "../klav-daemon/build.rs"

[dependencies]
klav-client = { workspace = true, features = ["health"] }
klav-daemon.workspace = true
# Reading QR images of Google Authenticator exports (ADR 0024).
klav-import = { workspace = true, features = ["qr-image"] }
klav-core.workspace = true
klav-proto.workspace = true
klav-sdk.workspace = true
clap = { version = "4.6", features = ["derive", "env"] }
csv = "1.4"
nix = { version = "0.31", default-features = false, features = ["fs", "hostname", "signal", "term", "user"] }
rpassword = "7.5"
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
# Editing agent client configs without rewriting what is not ours
# (ADR 0033 §3.6): pinned exactly, approved in CLAUDE.md.
toml_edit = { version = "=0.25.17", default-features = false, features = ["parse", "display"] }
jsonc-parser = { version = "=0.34.0", default-features = false, features = ["cst"] }
tokio = { version = "1", features = ["io-std", "io-util", "macros", "process", "rt-multi-thread", "signal", "time"] }
zeroize = "1.9"

[dev-dependencies]
# `klav sandbox` against a real proxy, in the test's own process: the
# binary in target/ may be another build's.
klav-proxy = { path = "../klav-proxy" }
# The end-to-end test of preferences an agent wrote edits the test
# server's SQLite file while it is stopped, as klav-client's tests do.
# Same version and features as klav-client and klav-sdk (no new package
# in Cargo.lock); approved by Omar on 2026-11-16.
sqlx = { version = "0.9", default-features = false, features = ["any", "sqlite-bundled", "postgres", "runtime-tokio", "migrate", "macros"] }
tempfile = "3"

# A command-line tool prints to stdout/stderr by design, so the workspace
# `print_stdout`/`print_stderr` lints are relaxed here (secrets are only
# printed by explicit commands: `--reveal`, `totp`, `generate`).
[lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[[bin]]
name = "klav"
path = "src/main.rs"

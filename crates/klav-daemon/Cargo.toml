[package]
name = "klav-daemon"
description = "Klav local daemon (`klavd`): unlocked state, Touch ID, native messaging"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository.workspace = true
publish.workspace = true

# `server` (default) is `klavd` itself and `klav-native-host`. Without it
# the library is only the client of the socket (`client`, `protocol`,
# `native`), for the Mac app's `KlavFFI` (ADR 0027 §3): no Touch ID shim,
# no QR reader and no command line in the app.
[features]
default = ["server"]
server = ["dep:klav-import", "dep:klav-touchid", "dep:clap", "dep:nix", "dep:secrecy", "tokio/rt-multi-thread", "tokio/signal"]

[dependencies]
klav-client = { workspace = true, features = ["health"] }
# `rp-id`: the passkey handlers validate the rpId before asking for presence.
klav-core = { workspace = true, features = ["rp-id"] }
# Reading QR images of Google Authenticator exports (ADR 0024).
klav-import = { workspace = true, features = ["qr-image"], optional = true }
klav-proto.workspace = true
klav-touchid = { workspace = true, optional = true }
clap = { version = "4.6", features = ["derive", "env"], optional = true }
# `socket`: `SO_PEERPIDFD` on Linux, which brings in `memoffset`; `process`:
# `PR_SET_DUMPABLE` on Linux, no crate (ADR 0041 §9, layer 1).
nix = { version = "0.31", default-features = false, features = ["process", "socket", "time", "user"], optional = true }
# The token of an agent's passkey use (ADR 0020 §9).
secrecy = { version = "0.10", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "sync", "time"] }
zeroize = "1.9"

[dev-dependencies]
klav-import = { workspace = true, features = ["qr-image", "samples"] }
tempfile = "3"

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "klavd"
path = "src/main.rs"
required-features = ["server"]

[[bin]]
name = "klav-native-host"
path = "src/native_main.rs"
required-features = ["server"]

[package]
name = "klav-touchid"
description = "Touch ID unlock for klavd: a Secure Enclave key through a small Swift shim (macOS)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository.workspace = true
publish.workspace = true
build = "build.rs"

[dependencies]
zeroize = "1.9"

# The FFI to the Swift shim needs `unsafe` (ADR 0013), always with a
# `// SAFETY:` comment, so this crate restates the workspace lints with
# `unsafe_code = "warn"` instead of `forbid`, like `klav-ffi`.
[lints.rust]
unsafe_code = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(klav_se_shim)"] }

[lints.clippy]
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
todo = "warn"
unwrap_used = "warn"
undocumented_unsafe_blocks = "deny"

<!doctype html>
<html><body>
  <form id="verify" action="/verify">
    <p>Escribe el código de 6 dígitos</p>
    <input id="d1" inputmode="numeric" maxlength="1" autocomplete="one-time-code" aria-label="Dígito 1">
    <input id="d2" inputmode="numeric" maxlength="1" aria-label="Dígito 2">
    <input id="d3" inputmode="numeric" maxlength="1" aria-label="Dígito 3">
    <input id="d4" inputmode="numeric" maxlength="1" aria-label="Dígito 4">
    <input id="d5" inputmode="numeric" maxlength="1" aria-label="Dígito 5">
    <input id="d6" inputmode="numeric" maxlength="1" aria-label="Dígito 6">
    <button type="submit">Verificar</button>
  </form>
  <form id="promo">
    <input id="p1" maxlength="1" aria-label="Talla">
    <input id="p2" maxlength="1" aria-label="Color">
  </form>
</body></html>

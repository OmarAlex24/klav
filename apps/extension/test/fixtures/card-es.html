<form>
  <input id="titular" name="titular" placeholder="Titular de la tarjeta">
  <input id="numero" name="numero" placeholder="Número de tarjeta" inputmode="numeric">
  <select id="mes" name="exp_mes" aria-label="Mes de vencimiento">
    <option value="">Mes</option><option value="1">01</option><option value="9">09</option><option value="12">12</option>
  </select>
  <select id="anio" name="exp_anio" aria-label="Año de vencimiento">
    <option value="">Año</option><option>2026</option><option>2027</option><option>2028</option>
  </select>
  <input id="cvv" name="cvv" placeholder="Código de seguridad" maxlength="4">
</form>

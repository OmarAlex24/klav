<!doctype html>
<!-- Source of the store's promotional images (store/images/). Query:
     ?w=440&h=280 (small tile) or ?w=1400&h=560 (marquee), &lang=en|es.
     Regenerate them with the commands in docs/publicar-extension.md §4.
     Same tokens and dither as apps/web/tools/og.html. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Klav promo tile</title>
<style>
@font-face { font-family: "Geist"; src: url("../../static/fonts/geist.woff2") format("woff2"); font-weight: 100 900; }
:root { --tinta: #09090b; --papel: #ffffff; --cruz: #a1a1aa; --gris: #71717a; --u: 1px; }
* { box-sizing: border-box; }
html, body { margin: 0; overflow: hidden; background: var(--papel); color: var(--tinta); -webkit-font-smoothing: antialiased; }
.card { position: relative; display: grid; grid-template-columns: 1fr var(--field); }
.copy { padding: calc(var(--u) * 30) calc(var(--u) * 24) calc(var(--u) * 28) calc(var(--u) * 32); display: flex; flex-direction: column; min-width: 0; }
.brand { display: flex; align-items: center; gap: calc(var(--u) * 8); font: 600 calc(var(--u) * 19)/1 "Geist", sans-serif; letter-spacing: -0.04em; }
.brand svg { width: calc(var(--u) * 22); height: calc(var(--u) * 14); }
h1 { margin: auto 0 0; font: 600 calc(var(--u) * 38)/0.98 "Geist", sans-serif; letter-spacing: -0.05em; }
p { margin: calc(var(--u) * 12) 0 0; font: 400 calc(var(--u) * 13.5)/1.35 "Geist", sans-serif; color: var(--gris); }
.field { position: relative; margin: calc(var(--u) * 22) calc(var(--u) * 22) calc(var(--u) * 22) 0; }
.field canvas { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
.field::before {
  content: ""; position: absolute; inset: -5px; z-index: 2;
  --c: linear-gradient(var(--cruz), var(--cruz));
  background:
    var(--c) left 0 top 4px / 9px 1px no-repeat, var(--c) left 4px top 0 / 1px 9px no-repeat,
    var(--c) right 0 top 4px / 9px 1px no-repeat, var(--c) right 4px top 0 / 1px 9px no-repeat,
    var(--c) left 0 bottom 4px / 9px 1px no-repeat, var(--c) left 4px bottom 0 / 1px 9px no-repeat,
    var(--c) right 0 bottom 4px / 9px 1px no-repeat, var(--c) right 4px bottom 0 / 1px 9px no-repeat;
}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="copy">
    <div class="brand">
      <svg viewBox="0 1 8 5" shape-rendering="crispEdges" aria-hidden="true"><path fill="currentColor" d="M1 1h2v1H1zM0 2h1v1H0zM3 2h1v1H3zM0 3h1v1H0zM3 3h5v1H3zM0 4h1v1H0zM3 4h1v1H3zM5 4h1v1H5zM7 4h1v1H7zM1 5h2v1H1z"/></svg>
      klav
    </div>
    <h1 id="title"></h1>
    <p id="lead"></p>
  </div>
  <div class="field"><canvas id="c"></canvas></div>
</div>
<script>
const q = new URLSearchParams(location.search);
const W = Number(q.get("w") ?? 440), H = Number(q.get("h") ?? 280), lang = q.get("lang") === "es" ? "es" : "en";
const TEXT = {
  en: ["Your keys, not your agent’s.", "Fill passwords in your browser. Agents ask first and never see the values."],
  es: ["Tus llaves, no las del agente.", "Rellena contraseñas en el navegador. Los agentes piden permiso y nunca ven los valores."],
};
document.documentElement.lang = lang;
document.getElementById("title").textContent = TEXT[lang][0];
// The small tile is seen small: the title alone.
if (W >= 600) document.getElementById("lead").textContent = TEXT[lang][1];
else document.getElementById("lead").remove();
// One unit per 280 px of height: the small tile is the reference.
const u = H / 280;
const root = document.documentElement.style;
root.setProperty("--u", `${u}px`);
root.setProperty("--field", `${Math.round(Math.min(W * 0.4, H * (W / H > 2 ? 1.35 : 0.62)))}px`);
const card = document.getElementById("card");
card.style.width = `${W}px`;
card.style.height = `${H}px`;
document.body.style.width = `${W}px`;
document.body.style.height = `${H}px`;

// The keyhole field from apps/web/public/index.html (and apps/extension/src/shared/dither.ts).
const BAYER = [[0,32,8,40,2,34,10,42],[48,16,56,24,50,18,58,26],[12,44,4,36,14,46,6,38],[60,28,52,20,62,30,54,22],
               [3,35,11,43,1,33,9,41],[51,19,59,27,49,17,57,25],[15,47,7,39,13,45,5,37],[63,31,55,23,61,29,53,21]];
const threshold = (x, y) => (BAYER[y & 7][x & 7] + 0.5) / 64;
function pick(b, n, th) { const st = n - 1, s = Math.min(1, Math.max(0, b)) * st, i = Math.min(st - 1, Math.floor(s)); return s - i > th ? i + 1 : i; }
function hash(x, y, seed) { let h = (x * 374761393 + y * 668265263 + seed * 2147483647) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967295; }
function vn(x, y, seed = 7) {
  const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi, sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
  const a = hash(xi, yi, seed), b = hash(xi + 1, yi, seed), c = hash(xi, yi + 1, seed), d = hash(xi + 1, yi + 1, seed);
  return a + (b - a) * sx + (c - a) * sy + (a - b - c + d) * sx * sy;
}
const clamp = (n) => Math.min(1, Math.max(0, n));
const streaks = (u, v, a, rows) => vn(u * a * 2.2, v * rows) * 0.65 + vn(u * a * 9, v * rows * 2, 11) * 0.35;
function dist(x, y, cx, cy, r) {
  const circle = Math.hypot(x - cx, y - cy) - r, top = cy, bottom = cy + r * 2.6, t = clamp((y - top) / (bottom - top)), half = r * (0.42 + 0.36 * t);
  return Math.min(circle, Math.max(Math.abs(x - cx) - half, Math.max(top - y, y - bottom)));
}
function field(u, v, a) {
  const d = dist(u * a, v, a / 2, 0.3, 0.12);
  if (d <= 0) return 1;
  const glow = Math.exp(-d * 16) * 0.75, ground = 0.12 + v * 0.42 + (streaks(u, v, a, 34) - 0.5) * 0.5;
  const sparks = v > 0.72 ? Math.max(0, vn(u * a * 5, v * 60, 3) - 0.78) * 2.4 : 0;
  return clamp(Math.max(ground + sparks, glow + ground * 0.4));
}
const pal = [[13, 20, 102], [35, 55, 255], [255, 255, 255]];
const canvas = document.getElementById("c"), r = canvas.getBoundingClientRect(), px = Math.max(3, Math.round(3 * u));
const w = Math.round(r.width / px), h = Math.round(r.height / px);
canvas.width = w; canvas.height = h;
const ctx = canvas.getContext("2d"), img = ctx.createImageData(w, h);
for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
  const c = pal[pick(field(x / (w - 1), y / (h - 1), w / h), 3, threshold(x, y))], o = (y * w + x) * 4;
  img.data[o] = c[0]; img.data[o + 1] = c[1]; img.data[o + 2] = c[2]; img.data[o + 3] = 255;
}
ctx.putImageData(img, 0, 0);
</script>
</body>
</html>

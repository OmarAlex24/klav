# Builds klav-server from this checkout (the root Dockerfile) instead of
# pulling the published image, for development, for a commit between releases,
# or for a machine the image doesn't cover (it is linux/amd64 only):
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# Everything else (port, volume, registration, hardening) comes from
# docker-compose.yml. Guide: docs/self-hosting.md §1.
services:
  klav:
    build: .
    image: klav-server:local
